[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "odr-journaline-encoder"
dynamic = ["version"]
description = "MPBNL Journaline WebFrontend: DAB Journaline (ETSI TS 102 979) carousel encoder with a web UI for ODR-DabMux"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.2",
    "cheroot>=8.6",
    "defusedxml>=0.7",
]

[project.scripts]
odr-journaline-encoder = "odr_jml.__main__:main"

[tool.setuptools]
packages = ["odr_jml", "odr_jml.encoder", "odr_jml.web"]

[tool.setuptools.dynamic]
version = { attr = "odr_jml.__version__" }

[tool.setuptools.package-data]
"odr_jml.web" = ["static/*"]
